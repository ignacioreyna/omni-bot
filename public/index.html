<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Omni-Bot">
  <meta name="theme-color" content="#0d1117">
  <title>Omni-Bot</title>
  <link rel="stylesheet" href="/vendor/xterm/css/xterm.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main id="home" class="view">
    <header class="bar">
      <h1>Omni-Bot</h1>
      <div class="bar-actions">
        <a class="icon-btn" href="/wake" title="Server controls">⏻</a>
        <button class="icon-btn" id="refresh" title="Refresh">↻</button>
        <button class="primary" id="new-session">+ New</button>
      </div>
    </header>
    <ul id="session-list" class="session-list"></ul>
    <p id="empty" class="empty" hidden>No tmux sessions running.<br>Create one to start Claude.</p>
  </main>

  <section id="term-view" class="view" hidden>
    <header class="bar term-bar">
      <button class="icon-btn" id="back" title="Back">‹</button>
      <span id="term-title" class="term-title"></span>
      <div class="bar-actions">
        <button class="icon-btn" id="font-down" title="Smaller">A−</button>
        <button class="icon-btn" id="font-up" title="Larger">A+</button>
      </div>
    </header>
    <div id="terminal-wrap">
      <div id="terminal"></div>
      <button id="disconnected" class="overlay" hidden>Disconnected — tap to reconnect</button>
    </div>
    <form id="composer" class="composer">
      <textarea id="composer-input" rows="1" placeholder="Message… (dictation works here)" autocapitalize="sentences"></textarea>
      <button class="primary" type="submit">Send</button>
    </form>
    <nav id="keybar" class="keybar">
      <button data-key="esc">Esc</button>
      <button data-key="ctrl" id="ctrl-key">Ctrl</button>
      <button data-key="ctrl-c">^C</button>
      <button data-key="tab">Tab</button>
      <button data-key="shift-tab">⇧Tab</button>
      <button data-key="up">↑</button>
      <button data-key="down">↓</button>
      <button data-key="left">←</button>
      <button data-key="right">→</button>
      <button data-key="enter">⏎</button>
      <button data-key="scroll-up">PgUp</button>
      <button data-key="scroll-down">PgDn</button>
      <button data-key="scroll-exit">Live</button>
      <button data-key="toggle-composer">⌨</button>
    </nav>
  </section>

  <dialog id="new-dialog">
    <form id="new-form" method="dialog">
      <h2>New session</h2>
      <label>Directory
        <input id="dir-filter" type="search" placeholder="Filter or type a path" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <ul id="dir-list" class="dir-list"></ul>
      <label>Name <span class="hint">(optional)</span>
        <input id="session-name" type="text" autocomplete="off" autocapitalize="off" spellcheck="false">
      </label>
      <label>Start with
        <select id="session-command">
          <option value="claude">claude</option>
          <option value="claude --continue">claude --continue</option>
          <option value="claude --resume">claude --resume</option>
          <option value="">shell only</option>
        </select>
      </label>
      <div class="dialog-actions">
        <button type="button" id="cancel-new">Cancel</button>
        <button type="submit" class="primary" id="create-session">Create</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>

  <script src="/vendor/xterm/lib/xterm.js"></script>
  <script src="/vendor/addon-fit/lib/addon-fit.js"></script>
  <script src="/vendor/addon-web-links/lib/addon-web-links.js"></script>
  <script src="/app.js"></script>
</body>
</html>
